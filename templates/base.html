<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AyudaMap{% endblock %}</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { margin: 0; padding: 0; background: #f8f9fa; color: #333; }
        header { background: #004d40; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        header a { color: white; text-decoration: none; margin-left: 1rem; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .messages { list-style: none; padding: 0; }
        .messages li { padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 4px; }
        .messages .success { background: #d4edda; color: #155724; }
        .messages .error { background: #f8d7da; color: #721c24; }
        .btn { display: inline-block; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .btn-primary { background: #007bff; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        input, select, textarea { width: 100%; padding: 0.5rem; margin: 0.4rem 0 1rem 0; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>
    <header>
        <h2><strong>AyudaMap</strong></h2>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'home:home' %}">Home</a>
                <span>Hello, <strong>{{ user.username }}</strong></span>
                <a href="{% url 'login:logout' %}" class="btn btn-danger">Logout</a>
            {% else %}
                <a href="{% url 'login:login' %}">Login</a>
                <a href="{% url 'register:register' %}">Register</a>
            {% endif %}
        </nav>
    </header>

    <div class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
