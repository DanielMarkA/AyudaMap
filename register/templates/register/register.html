{% extends 'base.html' %}
{% block title %}Register - AyudaMap{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;" class="card">
    <h3>Create an AyudaMap Account</h3>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
    </form>
    <p style="margin-top: 1rem; font-size: 0.9rem;">
        Already registered? <a href="{% url 'login:login' %}">Log in here</a>
    </p>
</div>
{% endblock %}
